[project]
name = "visurena-studio"
version = "0.1.0"
description = "Visurena Studio - AI content studio: books to audiobooks, shorts, songs, novels"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "google-api-python-client==2.149.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
    "imageio-ffmpeg==0.6.0",
    "jinja2==3.1.6",
    "matplotlib==3.10.7",
    "openai-whisper==20250625",
    "opencv-python-headless==5.0.0.93",
    "python-multipart==0.0.32",
    "pyyaml==6.0.2",
    "screenplain[pdf]==0.11.0",
    "speechbrain==1.0.3",
    "strands-agents[ollama,openai]==1.53.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]
measures = [
    "easyocr==1.7.2",
    "facenet-pytorch==2.6.0",
    "mediapipe==1.0.1",
    "scenedetect==0.7.1",
    "torchvision==0.29.0",
]
music = [
    "beat-this==1.1.0",
    "torch==2.14.0",
    "torchaudio==2.11.0",
]
qc = []
voice = [
    "resemblyzer==0.1.4",
    "setuptools==80.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `local` needs the local ComfyUI / a GPU model: free, slow, nondeterministic,
# and excluded from the default run.  Opt in with `-m local`.
markers = ["local: needs the local ComfyUI or a model on disk; excluded by default"]
addopts = "-m 'not local'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.uv]
# facenet-pytorch pins an old torch; the studio runs the torch the music group pins.
override-dependencies = ["torch==2.14.0", "torchvision==0.29.0", "numpy==2.5.2"]
