[project]
name = "visurena-studio"
version = "0.1.0"
description = "Visurena Studio - AI content studio: books to audiobooks, shorts, songs, novels"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.7",
    "pyyaml==6.0.2",
    "screenplain[pdf]==0.11.0",
    "speechbrain==1.0.3",
    "strands-agents[ollama,openai]==1.53.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]
music = [
    "beat-this==1.1.0",
    "torch==2.14.0",
    "torchaudio==2.11.0",
]
qc = []
voice = [
    "resemblyzer==0.1.4",
    "setuptools==80.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `local` needs the local ComfyUI / a GPU model: free, slow, nondeterministic,
# and excluded from the default run.  Opt in with `-m local`.
markers = ["local: needs the local ComfyUI or a model on disk; excluded by default"]
addopts = "-m 'not local'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
