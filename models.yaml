# models.yaml — THE model configuration. Agents ask for a TIER, never a model.
# Switching provider/model = edit here, zero code changes.
#
# Current choice (owner, 2026-08-23): OpenAI API direct — credits to use within 2 months.
# Later: flip a tier's provider to lmstudio/ollama/openrouter and everything follows.

default_tier: workhorse

# The owner's money wall (2026-10-04): "3 dollar max for episode generation".
# Every paid request checks the episode's recorded spend + its own estimate first
# and is refused BEFORE it is sent if it would cross this (studio/llm.guard_spend).
money:
  episode_ceiling_usd: 3.00

# Rates in USD per MILLION tokens. Nothing may be priced from memory: an unlisted model
# records its tokens and a NULL cost rather than a confident zero, because an unknown
# cost silently becoming $0.00 is how a spend estimate turns into a lie.
rates:
  gpt-5.6-luna:
    input_per_m: 0.20
    output_per_m: 1.20
  # gpt-5.6-terra: rate UNKNOWN. Add it here once confirmed; until then any run on
  # terra reports unpriced calls instead of a total.
  # OpenRouter story-writer candidates, live prices 2026-10-04 (openrouter.ai/api/v1/models):
  anthropic/claude-sonnet-5.5:   {input_per_m: 2.00, output_per_m: 10.00}
  anthropic/claude-opus-5.5:     {input_per_m: 4.00, output_per_m: 20.00}
  google/gemini-3.8-flash:       {input_per_m: 0.75, output_per_m: 3.75}
  deepseek/deepseek-v4-pro-0813: {input_per_m: 0.85, output_per_m: 5.00}
  moonshotai/kimi-k3:            {input_per_m: 0.72, output_per_m: 14.00}
  z-ai/glm-5.3:                  {input_per_m: 1.40, output_per_m: 4.40}
  openai/gpt-5.6-sol:            {input_per_m: 2.00, output_per_m: 10.00}

tiers:
  workhorse:              # validators, extraction drafts — cheap and fast
    provider: openai
    model: gpt-5.6-luna   # $0.20/M in, $1.20/M out (after July 2026 price cut)
    params:
      reasoning_effort: none   # Luna requires this for function tools on chat/completions
  reasoning:              # timeline arbitration, story editing, screenwriting
    provider: openai
    # 2026-08-25: pinned to luna for the first screenplay run because terra has NO
    # recorded price here, and the owner approved a $0.26 plan computed at luna rates.
    # Spending an unknown multiple of an approved figure is not an approved spend.
    # Flip back to gpt-5.6-terra once its rate is known and re-priced.
    model: gpt-5.6-luna
    params:
      reasoning_effort: none
  local:                  # the $0 tier for the format lines' agents (episode_writer, look_back)
    provider: openai      # OWNER 2026-09-24: the paid workhorse for now; making it free is a
    model: gpt-5.6-luna   # yaml edit (provider: lmstudio, model: gpt-oss:20b), no code change
    params:
      reasoning_effort: none
    # ---- STORY-WRITER OPTIONS (2026-10-04, OpenRouter live prices, USD per M tokens) ----
    # Measured writer call: ~51k tokens in, ~13k out (usage table, 400 calls).
    # A healthy plan is ~5-10 calls; ep14-16 looped 120-169 calls ($2.70-4.10) on luna.
    # To switch: comment the three lines above, uncomment ONE block below.
    #
    # provider: openrouter  # Claude Sonnet 5.5  $2.00 in / $10.00 out  ~$0.23/call  ~$1.15-2.30/plan
    # model: anthropic/claude-sonnet-5.5    # strongest prose + scene craft at a sane price
    #
    # provider: openrouter  # Claude Opus 5.5    $4.00 / $20.00   ~$0.46/call  ~$2.30-4.60/plan
    # model: anthropic/claude-opus-5.5      # best storytelling; can breach the $3 cap
    #
    # provider: openrouter  # Gemini 3.8 Flash   $0.75 / $3.75    ~$0.09/call  ~$0.45-0.90/plan
    # model: google/gemini-3.8-flash        # strong long-context reader for the chapter
    #
    # provider: openrouter  # DeepSeek V4 Pro    $0.85 / $5.00    ~$0.11/call  ~$0.55-1.10/plan
    # model: deepseek/deepseek-v4-pro-0813  # good value reasoner
    #
    # provider: openrouter  # Kimi K3            $0.72 / $14.00   ~$0.22/call  ~$1.10-2.20/plan
    # model: moonshotai/kimi-k3             # known for creative writing; pricey output
    #
    # provider: openrouter  # GLM 5.3            $1.40 / $4.40    ~$0.13/call  ~$0.65-1.30/plan
    # model: z-ai/glm-5.3
    #
    # provider: openrouter  # GPT-5.6 Sol        $2.00 / $10.00   ~$0.23/call  same as Sonnet
    # model: openai/gpt-5.6-sol
    # (current) provider: openai  GPT-5.6 Luna  $0.20 / $1.20  ~$0.03/call  ~$0.15-0.30/plan
  canon:                  # the look the world knows a character by (studio/canon.py)
    provider: openai
    # Measured 2026-09-04 on Watson: at effort none, three asks AGREED on a short
    # pointed beard, receding sandy hair and forty-five -- confidently wrong.  At
    # high, three of three: late twenties, a moustache, sun-darkened.  Recall of
    # a face needs the thinking; ~5k output tokens an ask, ~$0.02 a character,
    # asked once per book and cached in refs/canon.json.
    model: gpt-5.6-luna
    params:
      reasoning_effort: high

providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  lmstudio:
    base_url: http://localhost:1234/v1
    api_key_env: null          # local server needs no key
  ollama:
    host: http://localhost:11434
    api_key_env: null
