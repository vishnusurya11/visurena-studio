# stages.yaml — THE registry of every stage, step, and substep in the studio.
#
# Rules (docs/db/EVENT_MODEL.md):
#   - File order = execution order. Runners never hardcode the pipeline shape.
#   - ids are fixed-width 2-digit segments (01, 01_01, 01_01_01); text sort = pipeline order.
#   - ids are stable once events reference them. Insertions get a sub-level, never renumbering.
#   - A level nearing 99 means restructure into a sub-level, not more digits.
#   - Adding a stage/step/substep = edit this file + add the script. Nothing else changes.

stages:

  analysis:
    steps:
      - id: "01"
        name: ingest
        script: step_01_ingest
        desc: EPUB -> clean numbered text. Deterministic, zero LLM. Establishes the
          (chapter, paragraph) coordinate system every later claim anchors to.
        substeps:
          - id: "01_01"
            name: read_source
            desc: Open the EPUB (zip + spine, stdlib); parse OPF metadata (title, author)
              + spine + TOC; pull raw XHTML per spine document. In memory.
          - id: "01_02"
            name: clean
            desc: Drop non-content docs (cover, TOC page, colophon); strip Project
              Gutenberg license boilerplate; strip HTML -> plain paragraphs. In memory.
          - id: "01_03"
            name: chapterize
            desc: Map cleaned docs onto the TOC; capture parts + front matter (preface
              if present); number chapters 1..N continuous across parts, paragraphs
              1..M within each. Writes analysis/chapters/ch_NN.json.
          - id: "01_04"
            name: finalize
            desc: PYTHON CHECKS (hard rules, free) - counts match TOC, no empty chapters,
              contiguous numbering, sane word counts; source sha256; write the manifest
              analysis/book.json (title, author, parts, chapter list). Fails loudly.
          - id: "01_05"
            name: agent_check
            desc: STRANDS AGENT REVIEW (local model, judgment calls) - reads the manifest
              + chapter samples; flags what rules cannot catch (boilerplate leakage,
              broken chapter boundaries, wrong title, garbled text). Verdict + issue
              list -> event; details -> log.
          - id: "01_06"
            name: improve
            desc: Apply the agent's findings - adjust clean/chapterize parameters (e.g.
              boilerplate markers, chapter boundary fixes) and re-run 01_02..01_05.
              Max 2 improvement rounds; still failing -> step fails loudly for owner.
              Agent never edits outputs directly - it steers the deterministic code.

      - id: "02"
        name: extract
        script: step_02_extract
        desc: DEEP pass by the ANALYSIS CREW - specialized agents per dimension, working
          from a shared scene breakdown. Names/times AS WRITTEN; evidence quotes on all.
        substeps:
          - id: "02_01"
            name: breakdown
            desc: 1st AD (scene_breakdown agent) cuts each chapter into scenes with
              paragraph ranges, location-as-written, POV -> the call sheet.
          - id: "02_02"
            name: specialists
            desc: Per chapter, from the call sheet - script_supervisor (TIME evidence +
              continuity state changes), casting_director (who is in scene),
              story_analyst (events), dialogue_editor (who speaks to whom).
          - id: "02_03"
            name: assemble
            desc: PURE CODE - merge crew outputs by scene number ->
              analysis/extraction/ch_NN.json. Resume skips chapters already extracted.
          - id: "02_04"
            name: python_checks
            desc: Deterministic grounding - anchors in range, every quote verbatim in its
              scene's source paragraphs. Violations feed the improve loop.
          - id: "02_05"
            name: agent_check
            desc: extraction_auditor spot-audits chapters (full text vs extraction) -
              completeness + faithfulness per dimension.
          - id: "02_06"
            name: improve
            desc: Re-run flagged (chapter x dimension) specialists only; reassemble,
              re-check. Max 2 rounds; then loud failure for owner.

      - id: "03"
        name: standardize
        script: step_03_standardize
        desc: Extracted surface forms -> canonical entities with aliases AND map
          coordinates; every scene tagged with canonical ids. Never re-reads the book.
        substeps:
          - id: "03_01"
            name: collect
            desc: Gather every character/location surface form + chapters + counts (code).
          - id: "03_02"
            name: resolve
            desc: entity_resolver agent merges forms -> canonical characters and
              locations WITH lat/lon (coordinates make the timeline renderable).
          - id: "03_03"
            name: remap
            desc: Tag every scene with canonical ids -> analysis/scenes.json (code).
          - id: "03_04"
            name: checks
            desc: Coverage + coordinate + orphan-id checks (code).

      - id: "04"
        name: timeline
        script: step_04_timeline
        desc: Solve story-time -> WORLDLINES (which character at which location at what
          story time) + contradictions. Deterministic, zero LLM.
        substeps:
          - id: "04_01"
            name: partition
            desc: Split into narrative tracks - main frame vs embedded flashback
              (TLEX subordinated timeline), at chapter granularity.
          - id: "04_02"
            name: dayaxis
            desc: Merge per-chapter story_day counters into a track-global day axis
              via the evidence cascade (explicit offset > NIGHT->DAY > continuity).
          - id: "04_03"
            name: worldlines
            desc: Per character - observed / in-transit / presumed segments; frame
              narrator excluded from the tale told to them.
          - id: "04_04"
            name: contradict
            desc: Bilocation sweep + travel-feasibility (alibi query, 1881 cab speeds).
          - id: "04_06"
            name: fill_gaps
            desc: gap_filler agent places scenes the matcher could not, reading the
              scene and its neighbours. Code can interpolate an hour but never a
              PLACE. Answers marked `inferred`; "happens nowhere" is a valid answer;
              an id outside the canonical list is refused.
          - id: "04_05"
            name: emit
            desc: analysis/timeline.json - the video's and the UI's input.

      - id: "05"
        name: consolidate
        script: step_05_consolidate
        desc: Per-character and per-location files WITH EVOLUTION over the story
          (physical, mental, wardrobe, condition) - the building blocks for audiobook,
          songs, video.
        substeps:
          - id: "05_01"
            name: gather
            desc: Per entity - journey, state changes, quotes, companions (code).
          - id: "05_02"
            name: profile
            desc: profile_writer agent writes physical/mental/voice/arc + evolution
              lists FROM the dossier only (never re-reads the book).
          - id: "05_03"
            name: emit
            desc: analysis/characters/<id>.json and analysis/locations/<id>.json.
          - id: "05_04"
            name: checks
            desc: Every entity has a non-empty journey/scene list (code).

      - id: "06"
        name: verify
        script: step_06_verify
        desc: Whole-chain QC. Deterministic, zero cost. Proves the acceptance test -
          "which character is at which location at what story time" - is answerable.
        substeps:
          - id: "06_01"
            name: integrity
            desc: Every artifact present; counts agree across steps.
          - id: "06_02"
            name: coverage
            desc: Scene/location/character resolution rates; every location geo-coded.
          - id: "06_03"
            name: timeline
            desc: Worldline queryability per story day + contradiction summary.
          - id: "06_04"
            name: report
            desc: analysis/qc_report.json + printed verdict.

  # future stages — same shape, scripts in scripts/<stage>/
  # audiobook:
  #   steps: []
  # music:
  #   steps: []
  # video:
  #   steps: []

  # ---------------------------------------------------------------------------------
  # STAGE 02 — screenplay.  PLANNED, NOT BUILT.  Design: docs/screenplay/DESIGN.md
  #
  # Analysis ASSERTS what the book says; a screenplay INVENTS. Never put an inventing
  # step inside an asserting stage — the grounding apparatus that makes analysis
  # trustworthy would stop meaning anything. One analysis feeds MANY screenplays, so
  # this stage is keyed on (book, target), and targets live in targets.yaml.
  #
  # Step ids are STAGE-SCOPED: events key on (codex_id, stage, step_id), so
  # screenplay/01 never collides with analysis/01. "Stage 02" is this stage's position
  # in the studio, which file order already encodes.
  # ---------------------------------------------------------------------------------

  screenplay:
    steps:
      - id: "01"
        name: dossier
        script: step_01_dossier
        desc: Join what analysis scattered into one record per source scene. Code, zero
          LLM. Reads timeline.json (NOT scenes.json - 27 of 92 scenes are UNKNOWN
          there) and re-attaches int_ext, dialogue, events and pov, which survive only
          in analysis/extraction/. Per BOOK, shared by every target.
        substeps:
          - id: "01_01"
            name: gather
            desc: Read the six analysis/source artifact families; hash them into
              input_sha256 (the resume key).
          - id: "01_02"
            name: join
            desc: Resolve surface names to canonical ids via registry aliases; attach
              int_ext / dialogue / events / pov from extraction; build CHARACTER cues;
              carry verbatim paragraph spans for is_grounded().
          - id: "01_03"
            name: checks
            desc: Every scene has int_ext, a location name, DAY|NIGHT; every speaking
              character resolves to a registry id. WARN (never fail) on a speaking
              character with no profile.voice - 15 of 23 lack one today.
          - id: "01_04"
            name: emit
            desc: Writes screenplay/dossier.json.

      - id: "02"
        name: plan
        script: step_02_plan
        desc: What survives, and in what order. ONE agent call per target. Adaptation is
          fixed-budget allocation, not compression - every screenplay lands in
          22-33k words regardless of source size.
        substeps:
          - id: "02_01"
            name: brief
            desc: Code assembles the target config plus a scene index (~40 words per
              scene, ~5k tokens for 92 scenes).
          - id: "02_02"
            name: select
            desc: AGENT story_editor (reasoning tier) -> ScreenplayPlan. Groups scenes
              into SEQUENCES (~4.5 slug lines each), not one beat per scene.
          - id: "02_03"
            name: checks
            desc: Code - every beat's (chapter, scene) exists; roster is a subset of the
              registry; budget within target; EVERY source scene is either inside a beat
              or listed in `omitted` with a reason. Silent dropping is the failure mode.
          - id: "02_04"
            name: emit
            desc: Writes <target>/plan.json plus source_fingerprint.

      - id: "03"
        name: draft
        script: step_03_draft
        desc: The paid work. Two agent calls per beat, each scene file written the moment
          it exists so a crash at beat N keeps 1..N-1.
        substeps:
          - id: "03_01"
            name: write
            desc: AGENT screenwriter (reasoning) -> the ordered element stream. Owns
              action AND dialogue - they interleave, so one writer owns both. Every
              dialogue element carries provenance verbatim|adapted|invented.
          - id: "03_02"
            name: shoot
            desc: AGENT shot_designer (workhorse) -> shots attached to element INDICES in
              the frozen stream. Separate agent because it merges mechanically and can be
              re-run alone without paying to rewrite dialogue.
          - id: "03_03"
            name: assemble
            desc: Code - sluglines, CONT'D/CONTINUOUS, page_eighths, scene numbering.
              Never asked of an agent; models cannot count rendered lines.

      - id: "04"
        name: render
        script: step_04_render
        desc: Code, zero LLM, byte-stable. Always re-runs - it is free.
        substeps:
          - id: "04_01"
            name: json
            desc: Writes <target>/screenplay.json - THE ARTIFACT. Every downstream stage
              reads this. Fountain is LOSSY (no provenance, no source refs, no camera
              fields), so nothing may parse it back to recover a fact.
          - id: "04_02"
            name: fountain
            desc: Writes screenplay.fountain, rendered FROM the json, never assembled.
          - id: "04_03"
            name: pdf
            desc: Writes screenplay.pdf via screenplain - industry geometry, Courier 12.
              NOTE `python -m screenplain` does not work; the API is the only entry.
          - id: "04_04"
            name: elements
            desc: Writes elements.json - flat shot list keyed (scene, shot) for the
              future video stage. A generated VIEW; screenplay.json wins on conflict.
          - id: "04_05"
            name: format
            desc: ROUND-TRIP LINT - parse our own output and assert the parser's typing
              matches the intent, line by line. Fountain falls back to Action on anything
              unrecognised, so a parser NEVER rejects; silent misparse is the normal
              failure. Plus runtime/page budget vs the target.

      - id: "05"
        name: verify
        script: step_05_verify
        desc: Deterministic guards first, one agent over a sample second. Nothing here
          scores; findings must be located and quotable.
        substeps:
          - id: "05_01"
            name: guards
            desc: G1 coordinate (every source ref exists) - G2 roster (character exists
              AND the timeline puts them there) - G3 place-and-time (narrowing DAY->DAWN
              allowed, contradiction refused) - G4 verbatim-claim (a failed is_grounded()
              DOWNGRADES to adapted and counts, never fails).
          - id: "05_02"
            name: audit
            desc: AGENT adaptation_auditor (workhorse) over K=3 sampled scenes. Checks
              CONTRADICTION, never difference. An issue whose book_quote fails
              is_grounded() is dropped before the improve loop - the auditor cannot
              manufacture evidence.
          - id: "05_03"
            name: improve
            desc: Re-run ONE dimension (write | shoot) for blocking findings only.
              MAX_IMPROVE_ROUNDS = 2, then log and proceed.
          - id: "05_04"
            name: report
            desc: Writes <target>/qc_report.json.

  trailer:
    # One unattended run per book, on a TIME ceiling (nothing here spends money:
    # MiniMax Music 3, MiniMax-H3 and Qwen3-TTS all run on the local ComfyUI).
    # Every step: typed input -> typed output -> a gate that can fail -> an
    # ADAPT ladder that re-authors to the same FUNCTION -> a terminal fallback.
    # Every rung taken is a learning (trailer/<id>/learnings.jsonl) for the
    # retrospect. Blueprint: .claude/skills/trailer/BLUEPRINT.md
    steps:
      - id: "01"
        name: story
        script: step_01_story
        desc: Derive lead / figure / turn / resolution from analysis + screenplay
          (code); narrator, register, thesis (one structured agent call, gated).
          Writes trailer/<id>/story.json. Fallback register=procedural, thesis=null.
      - id: "02"
        name: refs
        script: step_02_refs
        desc: Character and location reference sheets, gated on a TRAIT CARD the
          local VLM reads off each sheet - a new face must differ from every bound
          one in >= 3 seen traits. Reroll seed x1, distinguish x3 (rewrite exactly
          the matched traits), then the character is UNBOUND and its setups excluded.
      - id: "03"
        name: music
        script: step_03_music
        desc: Render 4 seeds, MEASURE metre + events + slots, rank on fitness. Below
          floor - 4 more seeds, then re-author the caption in the same register x2,
          then best-of-all on the onset grid flagged rubato. Writes music/metre.json.
      - id: "04"
        name: lines
        script: step_04_lines
        desc: Four pools, Wikiquote iconicity (revid cache; offline -> cached/thin),
          rank, function labels (agent), order hook->answer->threat->title->button.
          No hook after relabel -> music-only slate, flagged.
      - id: "05"
        name: voice
        script: step_05_voice
        desc: Design one reference per speaker, clone every slate line, similarity gate
          >= 0.75. Reroll x3 -> next line of the same function -> card. Measured seconds.
      - id: "06"
        name: plan
        script: step_06_plan
        desc: Beat walk over the measured metre; one setup per cut, capped by the
          takes step 07's remaining share affords (11 min each, one held in reserve);
          setups bound to references; lines assigned to slots from measured seconds.
          Unbound setup -> alternate in the same beat -> location-only shot. Refuses
          a plan without the lead in >= 25%.
      - id: "07"
        name: clips
        script: step_07_clips
        desc: The slow step (~11 min per take, local GPU). Trait-card gate per take -
          three frames described by the VLM must match the reference card in all
          but < 3 seen traits.
          Reroll x2 -> whole-take close-up -> best take capped at 0.6 s. A beat is
          dropped only when no take exists (no time for a first render, or the
          render failed). Reads the remaining time budget before every render.
      - id: "08"
        name: assemble
        script: step_08_assemble
        desc: Cut on the beat list, grade, title on the measured hit, line layer with
          mid-band duck, synthesised sound, mix. Deterministic; a failure is a bug.
      - id: "09"
        name: qc
        script: step_09_qc
        desc: Reads the DELIVERED master - tracks its audio, scene-detects its picture,
          reports on-beat / on-downbeat / L0 / cap / title / line-over-bed. Fail ->
          re-cut x2 (free) -> ship flagged. Writes qc.json beside the master.
      - id: "10"
        name: deliver
        script: step_10_deliver
        desc: manifest.json (every rung taken, every measured number), Telegram send
          (retry x3), learnings closed. Never publishes; the orchestrator does.


  # =================================================================================
  # DIVISION — PRE-PRODUCTION (continued).  refs: the reference bible.
  # One sheet per character, one per key prop, one voice per speaker, per (book,
  # style). The ONLY writer of refs/refs.json; every format line reads it, none
  # writes it. Run just-in-time: the scheduler launches it when a plan binds an
  # entity with no row. LOOK is judged (judge:look), never signed by a person.
  # =================================================================================

  refs:
    unit: [book, style]
    requires: [analysis/05]
    steps:
      - id: "01"
        name: canon
        script: step_01_canon                     # WRAP scripts/refs/cast_rows.py + agents/casting_director.py
        in:
          - analysis/scenes.json
          - analysis/characters/*.json
        out:
          - refs/refs.json
        desc: >-
          Which entities this book binds. AGENT casting_director rows name who
          appears; code writes one refs.json row per character (display name,
          gender, chapter stamp) and refuses an id outside the analysis registry.
        substeps:
          - id: "01_01"
            name: list
            desc: >-
              AGENT (workhorse, local tier) -> CastList from analysis scenes.
          - id: "01_02"
            name: rows
            desc: >-
              Code writes and stamps the rows (cast_rows). Every later reader
              refuses a row stamped for another unit.

      - id: "02"
        name: sheets
        script: step_02_sheets                    # WRAP build_pack, prop_refs, cast_bust; trait card from trailer step_02_refs
        in:
          - refs/refs.json
          - analysis/characters/*.json
          - analysis/props/*.json
        out:
          - refs/characters/*/sheet.png
          - refs/props/*/sheet.png
          - refs/pack.jsonl
        desc: >-
          One sheet per character and per key prop from profile.design on the
          local image model; pack.jsonl records prompt and seed. A picture on disk
          is never redrawn. Paid sheet route only behind approval kind sheets.
        substeps:
          - id: "02_01"
            name: draw
            desc: >-
              Local render; content-addressed staging.
          - id: "02_02"
            name: traits
            desc: >-
              AGENT trait_reader (local VLM) -> TraitCard; code refuses a new
              face that does not differ from every bound face in the calibrated
              number of seen traits. Reroll seed x1, distinguish x3, then UNBOUND.
          - id: "02_03"
            name: look_back
            desc: >-  # MISSING
              AGENT look_back (local VLM) reads each new sheet against its own
              prompt (must-appear nouns, facial hair both ways); a miss is redrawn
              with the defining state first; the look judge (step 04) signs.

      - id: "03"
        name: voices
        script: step_03_voices                    # WRAP scripts/cast/cast_voices.py
        in:
          - refs/refs.json
          - cast/*/character.json
          - episodes/*/plan.json
        out:
          - cast/*/voice/*
        desc: >-
          New speakers only. AGENT voice_director -> VoiceDesign (region, body,
          speech, a register nobody else holds); local TTS renders the design clip;
          code measures pairwise similarity against every bound voice and refuses
          a match. Filed at book level under cast/<id>/voice/.

      - id: "04"
        name: verdict
        script: step_04_verdict                   # MISSING
        in:
          - refs/pack.jsonl
          - refs/refs.json
          - refs/characters/*/sheet.png
          - refs/props/*/sheet.png
        out:
          - refs/verdict.json
          - refs/manifest.json
        desc: >-
          LOOK, judged. JUDGE look (studio/judges/look.py): must nouns, a
          recognised string, an extra limb, a lookalike pair and a stranger are
          hard; a style outlier and a near voice are flags. Ladder: redraw on the
          next seed, then with the defining state first; the terminal keeps the
          best sheet flagged. Signs refs/verdict.json bound to the pack.jsonl sha
          (signed_by judge:look@1); a stale pack judges only its new rows. Every
          format line refuses a pack without a current verdict.

  # =================================================================================
  # DIVISION — PRODUCTION.  One stage per FORMAT LINE.  Step vocabulary shared by
  # every line: plan, record, board, shoot, edit, qc, deliver. A line may skip a
  # word, never reorder one. A line ENDS at deliver (master + qc + manifest) and
  # never publishes; Distribution does.
  # ---------------------------------------------------------------------------------
  # episode: one unit of story (a chapter, or a chapter range) -> one finished
  # master, $0, local GPU. Contract: studio/episode_spec.Episode. Gates:
  # .claude/skills/episode/GATES.md. Every step: typed input -> typed output -> a
  # gate that can fail -> an adapt ladder -> a terminal rung that signs flagged and
  # writes an audit row (never a silent pass, never a park). GPU time is a ceiling.
  # =================================================================================


  # =================================================================================
  # DIVISION — PRODUCTION.  One stage per FORMAT LINE.  Step vocabulary shared by
  # every line: plan, record, board, shoot, edit, qc, deliver. A line may skip a
  # word, never reorder one. A line ENDS at deliver (master + qc + manifest) and
  # never publishes; Distribution does.
  # ---------------------------------------------------------------------------------
  # episode: one unit of story (a chapter, or a chapter range) -> one finished
  # master, $0, local GPU. Contract: studio/episode_spec.Episode. Gates:
  # .claude/skills/episode/GATES.md. Every step: typed input -> typed output -> a
  # gate that can fail -> an adapt ladder -> a terminal rung that signs flagged and
  # writes an audit row (never a silent pass, never a park). GPU time is a ceiling.
  # =================================================================================

  episode:
    unit: [book, chapter]                         # "ch04" or a range "ch04-05"
    requires: [analysis/06, refs/04]              # reads screenplay/<target> when present
    steps:
      - id: "01"
        name: bind
        script: step_01_bind                      # WRAP scripts/refs/cast_rows.py (chapter stamp)
        in:
          - analysis/scenes.json
          - refs/refs.json
        out:
          - refs/refs.json
        desc: >-
          This unit's cast. Code stamps the bound rows with the unit; a
          character with no refs row parks the unit and orders refs for it.
        substeps:
          - id: "01_01"
            name: cast
            desc: >-  # MISSING
              AGENT cast_lister (workhorse, local tier) -> CastList for the
              unit's scenes; code refuses an id outside the registry.
          - id: "01_02"
            name: rows
            desc: >-
              Code rewrites refs.json rows for this unit (cast_rows).

      - id: "02"
        name: plan
        script: step_02_plan                      # WRAP plan_check; the writer is new
        in:
          - analysis/scenes.json
          - analysis/characters/*.json
          - analysis/locations/*.json
          - analysis/dq_rules.json
          - screenplay/*/elements.json
          - refs/refs.json
        out:
          - episodes/{unit}/plan.json
          - episodes/{unit}/plan.verdict.json
        desc: >-
          The contract, gated before anything is voiced or drawn. plan.json is
          data under the unit folder; no plan lives in the code tree.
        substeps:
          - id: "02_01"
            name: brief
            desc: >-
              Code assembles the chapter's analysis rows, the screenplay
              elements for those scenes where a target exists, the bound rows, the
              place rows, the camera catalog and the book's dq_rules.
          - id: "02_02"
            name: write
            desc: >-  # MISSING
              AGENT episode_writer (reasoning, local tier) -> Episode. Names
              people only through cast_refs.tag from the bound row; declares every
              unnamed person; one picture per place per unit.
          - id: "02_03"
            name: checks
            desc: >-
              Code - every free gate in one pass (plan_check + cell gates +
              take-path lint). Exit 1 is a stop.
          - id: "02_04"
            name: improve
            desc: >-  # MISSING
              Refusals quoted back to the writer; max 2 rounds; then a fresh brief,
              then the reasoning tier; a battery that still refuses defers the unit
              (plan.deferred.json, an audit row, no signature).
          - id: "02_05"
            name: lock
            desc: >-
              JUDGE plan (agents/plan_reader + studio/judges/plan.py): the critic
              LISTS the turn, the answer, the coverage and every claim with its
              chapter span, three times; code judges. A critic fault ends in the best
              draft signed flagged. Code writes plan.json only through
              episode_home.write_plan and signs plan.verdict.json bound to the plan
              sha (signed_by judge:plan@1).

      - id: "03"
        name: places
        script: step_03_places                    # WRAP scripts/refs/places.py
        in:
          - episodes/{unit}/plan.json
          - analysis/locations/*.json
        out:
          - refs/locations/*/*.png
        desc: >-
          Each setup's location+view at THIS unit's hour, drawn from its own
          described words on the local image model. A recurring place is never
          pinned to one picture.
        substeps:
          - id: "03_01"
            name: draw
            desc: >-
              Every setup resolves to a picture on disk (guard test).
          - id: "03_02"
            name: look_back
            desc: >-  # MISSING
              AGENT look_back reads each new picture against its prompt (the
              landmark, the hour); a miss is redrawn; a second miss is flagged.

      - id: "04"
        name: record
        script: step_04_record                    # WRAP say_lines + speaker_check
        in:
          - episodes/{unit}/plan.json
          - cast/*/voice/design.wav
        out:
          - episodes/{unit}/audio/lines/*.wav
          - episodes/{unit}/audio/lines/lines.json
          - episodes/{unit}/review/speaker_check.json
        desc: >-
          Every line in its character's voice, MEASURED and LISTENED to.
        substeps:
          - id: "04_01"
            name: say
            desc: >-
              Local TTS clone per line; seconds measured from the file.
          - id: "04_02"
            name: listen
            desc: >-
              AGENT listener (Whisper) reads each clip back; not word-perfect
              -> re-roll once -> refuse. Similarity to the design clip.
          - id: "04_03"
            name: spread
            desc: >-
              One speaker, one voice across the unit (advisory).

      - id: "05"
        name: timeline
        script: step_05_timeline                  # WRAP respot + timeline
        in:
          - episodes/{unit}/plan.json
          - episodes/{unit}/audio/lines/lines.json
        out:
          - episodes/{unit}/placed.json
        desc: >-
          AUDIO FIRST - the animatic. Every shot's seconds derive from the
          measured voice; placed.json is fingerprinted to the plan AND the voice;
          every reader goes through load_placed.
        substeps:
          - id: "05_01"
            name: respot
            desc: >-
              Cuts rescaled measured/projected on the grid.
          - id: "05_02"
            name: place
            desc: >-
              placed.json inside the format's band; misaligned() refuses a
              line off its shot's start plus the handle.

      - id: "06"
        name: prompts
        script: step_06_prompts                   # WRAP takes_r2v --prompts + no_last_frame
        in:
          - episodes/{unit}/plan.json
          - episodes/{unit}/audio/lines/lines.json
          - episodes/{unit}/placed.json
        out:
          - episodes/{unit}/takes/r2v/prompts.json
        desc: >-
          Every take prompt built and linted for $0 with no GPU, BEFORE any
          grid: length per block, style line, banned props, no last frame, no
          fragments. HARD.

      - id: "07"
        name: board
        script: step_07_board                     # WRAP grids
        in:
          - episodes/{unit}/plan.json
          - refs/characters/*/sheet.png
          - refs/props/*/sheet.png
          - refs/locations/*/*.png
        out:
          - episodes/{unit}/storyboard/layout.json
          - episodes/{unit}/storyboard/grids/*.png
        desc: >-
          Storyboard grids on the local image model from the plan's prose, up
          to three references - cast sheets first, the setup's place last.
        substeps:
          - id: "07_01"
            name: layout
            desc: >-  # MISSING
              Code lays a setup out by rule (studio/grid_layout, judge grid_layout@1):
              grids of at most nine, cols x rows = shots, a face alone in a 1x1 when a
              setup mixes a close with wides; writes storyboard/layout.json.
          - id: "07_02"
            name: draw
            desc: >-
              One render per grid; the manifest written AFTER the render with
              the prompt and every staged picture's bytes.

      - id: "08"
        name: panels
        script: step_08_panels                    # WRAP panels + panel_check + panel_content_check
        in:
          - episodes/{unit}/plan.json
          - episodes/{unit}/storyboard/grids/*.png
        out:
          - episodes/{unit}/storyboard/shot_*.png
          - episodes/{unit}/storyboard/panel_dq.json
          - episodes/{unit}/storyboard/panel_content.json
          - episodes/{unit}/storyboard/contact.png
          - episodes/{unit}/storyboard/eye_*.json
        desc: >-
          One panel per shot, two machine gates, then `judge:panel_eye`. The takes refuse
          without all three verdicts.
        substeps:
          - id: "08_01"
            name: cut
            desc: >-
              Panels cut between measured gutters, cropped square; a stale
              grid or a shot in two grids is refused.
          - id: "08_02"
            name: dq
            desc: >-
              People vs faces+extras, missing face, sharpness, ink, stacked.
              HARD. Nothing judged = nothing passed.
          - id: "08_03"
            name: content
            desc: >-
              AGENT panel_reader (local VLM, shown no plan) LISTS; code JUDGES
              against the plan, the landform and the book's banned list. Unread
              = fail.
          - id: "08_04"
            name: contact
            desc: >-  # MISSING
              Code writes one contact sheet of every panel.
          - id: "08_05"
            name: eye
            desc: >-
              JUDGE panel_eye (studio/judges/panel_eye.py): the stored dq and content
              rows plus hats worn and held, a reference handed back, posture, framing,
              clones, lettering, an invented landmark and repeats, with one short size
              read as the second vote. Signs storyboard/eye_<sha8>.json (signed_by
              judge:panel_eye@1); the takes refuse without it.
          - id: "08_06"
            name: improve
            desc: >-  # partial
              A failed grid is superseded and redrawn (shots, tag or seed
              bump); old files move to storyboard/superseded/. Max 2 rounds per
              grid.

      - id: "09"
        name: shoot
        script: step_09_shoot                     # WRAP takes_r2v render, take_dq, take_content_check, take_strip
        in:
          - episodes/{unit}/storyboard/shot_*.png
          - episodes/{unit}/storyboard/eye_*.json
          - refs/characters/*/sheet.png
          - episodes/{unit}/audio/lines/*.wav
          - episodes/{unit}/takes/r2v/prompts.json
        out:
          - episodes/{unit}/takes/r2v/T??.mp4
          - episodes/{unit}/takes/r2v/T??.dq.json
          - episodes/{unit}/takes/r2v/T??.content.json
          - episodes/{unit}/takes/r2v/eye_*.json
        desc: >-
          The slow step. ref2va takes on the local video model, staged from
          the panel, the sheets the shot's faces need and the line's wav. A take
          is current only to its words AND its pictures. Approval kind render;
          the GPU lease: one GPU, one stage; the queue is read before every POST.
        substeps:
          - id: "09_01"
            name: round
            desc: >-
              Every live shot's next take rendered back to back with the model
              resident.
          - id: "09_02"
            name: dq
            desc: >-
              Frozen start, cut landing, churn, zoom, face at end, look,
              pulse, lip-sync lag and WER, held, jump. HARD rows as marked.
          - id: "09_03"
            name: content
            desc: >-
              AGENT panel_reader on three frames past the head leak, each
              read alone; code judges.
          - id: "09_04"
            name: strip
            desc: >-
              Code writes a strip of every take; JUDGE take_eye
              (studio/judges/take_eye.py): dq rows, content, identity against the
              sheet, clones, pass-through, rotation, leak, a cut vote and mouth lag.
              Signs takes/r2v/eye_<sha8>.json (signed_by judge:take_eye@1); the cut
              refuses without it.
          - id: "09_05"
            name: retake
            desc: >-  # partial
              LADDER matching cure to cause: moving take froze -> seed; still take
              froze -> change the move TYPE; lag -> shorter take; the same fault on a
              fresh seed -> back to the PLAN (re-aim at what the cell holds) -> a
              still from the passed panel on a narration shot (at most two, never
              adjacent) or the best take kept flagged, high on a dialogue, turn or
              button shot. One batched round, --why recorded; the losing attempt kept
              under attempts/; never a dropped shot.

      - id: "10"
        name: edit
        script: step_10_edit                      # WRAP series_title + assemble (+ trailer metre for the bed)
        in:
          - episodes/{unit}/takes/r2v/T??.mp4
          - episodes/{unit}/takes/r2v/eye_*.json
          - episodes/{unit}/placed.json
          - episodes/{unit}/audio/lines/*.wav
        out:
          - title/{unit}.mp4
          - episodes/{unit}/cut/master_r2v.mp4
        desc: >-
          Title card, measured bed, cut, mix. Picture cut to the measured
          voice. cut/master_iterN.mp4, never overwriting.
        substeps:
          - id: "10_01"
            name: title
            desc: >-
              Series base once per book; the unit's lettering read back by
              OCR; short animated card.
          - id: "10_02"
            name: bed
            desc: >-  # partial
              Tone spans -> local music bed, metre MEASURED and ranked on
              fitness (the trailer's music step); bed gate.
          - id: "10_03"
            name: cut
            desc: >-
              Takes trimmed to placed.json, lines at their at, mix to the
              house loudness, captions, end chip.
          - id: "10_04"
            name: sound
            desc: >-
              The plan's spot effects (Shot.sounds) and a per-setup ambience
              (Setup.ambience), rendered locally by Stable Audio 3 SFX
              (studio/episode_sound.py); lines offset by their delivery. QC
              fails a planned sound the master does not let you hear.

      - id: "11"
        name: qc
        script: step_11_qc                        # WRAP qc + eye_review + dossier
        in:
          - episodes/{unit}/cut/master_r2v.mp4
          - episodes/{unit}/plan.json
          - episodes/{unit}/placed.json
        out:
          - episodes/{unit}/qc_r2v.json
          - episodes/{unit}/review/eye_*.json
        desc: >-
          Measure the DELIVERED master, never the intention. Stamps the sha8
          it measured. No import from the edit step.
        substeps:
          - id: "11_01"
            name: measure
            desc: >-
              Loudness, every planned cut, every line heard on the mix, the
              silent-gap wall naming its shot, edit is the takes, every take
              judged twice, title card present.
          - id: "11_02"
            name: recut
            desc: >-  # partial
              Fail -> the silent shot gets a line or the silence moves; re-cut x2
              (free); then one retake through the take ladder; then the rubric is
              flagged with its evidence.
          - id: "11_03"
            name: eye
            desc: >-
              JUDGE master_eye (studio/judges/master_eye.py) answers the five rubric
              questions from measures - shadow, faces, board, repeats, story - plus a
              thirty-frame read and a cross-take identity pass; writes
              review/eye_<sha8>.json (signed_by judge:master_eye@1); an n carries the
              judge's evidence and is never waived by a judge.
          - id: "11_04"
            name: dossier
            desc: >-
              Code - one page of every input, prompt, picture, take, verdict.
          - id: "11_05"
            name: audit
            desc: >-
              Code - the unit's audit sheet (scripts/audit/sheet.py): every flag
              with the judge's numbers beside the wall and a seeded sample of
              passes per gate, under library/<book>/audit/. No step reads it;
              the owner does, when he likes, and his notes append to the casebook.

      - id: "12"
        name: deliver
        script: step_12_deliver                   # MISSING (trailer step 10 is the model, without the external subprocess)
        in:
          - episodes/{unit}/cut/master_r2v.mp4
          - episodes/{unit}/qc_r2v.json
          - episodes/{unit}/plan.verdict.json
          - episodes/{unit}/storyboard/eye_*.json
          - episodes/{unit}/takes/r2v/eye_*.json
          - episodes/{unit}/review/eye_*.json
          - episodes/{unit}/timing.jsonl
        out:
          - episodes/{unit}/manifest.json
        desc: >-
          manifest.json beside the master (every gate verdict, every rung,
          timing totals), the deliverable's full path printed first, notify()
          through the platform. Never publishes; Distribution does.
