# The proof report's question map (2026-10-21_ep02_proof DESIGN 5.2), read by scripts/proof/confidence.py.
#
# Reviewable data, not code.  Each question names:
#   checks   the checks PROVEN needs, each with the distinct-point minimum it must reach (min_n) and the
#            kind of row that satisfies it (quality unless said); a check id is the design's id (S0a, F1,
#            A-caps, ...) or the suite's row name (face_replay rows, time_backtest_loo, ...)
#   gates    checks whose row must PASS before the question can leave REAL-RUN (an instrument's calibration,
#            a recording's coverage); a failing gate row means "not answerable from recordings", never FAILING.
#            A gate row answers every question that names it, whichever question the suite wrote it under.
#            While a gate is shut only a check marked `ungated: true` can fail the question (DESIGN 5.2: Q3's
#            R^2 is valid without the eye gate); every other failed row prints behind the gate
#   staged   the staged real runs (staged_runs below) that would answer what recordings cannot
#   real_run true: no recording can answer it; the status is REAL-RUN whatever the rows say
#   cap_uncalibrated_shape  true: capped at PARTIAL while the fake ComfyUI's shape is uncalibrated (R12)
#   compliance_apart        true: kind=compliance rows print apart and never upgrade the question (R17)
#   time     true: a time MEASURE (kind quality or baseline) counts only with clock `measured` and evidence
#            whose every path is absolute and outside any sandbox; any other is refused (R15, fail closed).
#            Mechanism and gap rows (A-caps) measure no duration: they still count, and still fail
#   baseline what prints beside the question as its base rate
#
# Every id below is one a suite's own row builder writes, under the question and kind named here, or it is
# listed under not_yet_emitted; tests/test_proof_confidence_report.py builds the rows from the builders
# (scripts/proof/face_replay.py proof_rows / instrument_report / panel, scripts/proof/rehearse.py
# summary_row over its TABLE, studio/rehearsal/asserts.py, studio/rehearsal/time_model.py result_rows,
# confidence.py's adapters over P2's incidents.json and preconditions_ch2.json) and fails on any other id.
# A renamed check is edited HERE, in the same commit as the suite that renames it.

not_yet_emitted:
  D1: the refine graph byte compare (DESIGN 4.2, package P6; n from 2 to 5 by SR-3); no suite writes it yet
  plan_battery_ch2: the plan battery on ch2's step-02 plan (Q8, kind compliance); needs SR-2's recorded writer session

staged_runs:
  SR-0:
    what: owner labels on the ep01 face strip (and recorded crops from other delivered episodes to reach n >= 30)
    machine_min: 0
    owner_min: 2-5
    owner_go: true
  SR-1:
    what: the first-pass refine RENDERED on ep01's iter1 takes, on the GPU, ComfyUI idle
    machine_min: 20
    machine_note: priced at face_refine.REFINE_TAKE_S (81 s) x ep01's 15 refined takes; P6 prints the gpu_busy_s sum
    owner_go: true
  SR-2:
    what: record_writer.py, one real step-02 session for ch2 in a sandbox (subscription)
    machine_min: 40
    owner_go: true
  SR-3:
    what: re-render 3 more recorded refine graphs and compare bytes (D1 n from 2 to 5)
    machine_min: 6
    owner_go: true
  SR-4:
    what: ep02 steps 01-08 in a sandbox under the real engine (never the real library), no takes
    machine_min: 120
    owner_go: true
  SR-5:
    what: record_comfy_transcript.py proxy during the next real job (calibrates the fake ComfyUI's shape)
    machine_min: 0
    machine_note: rides a real job; no extra machine time
    owner_go: true

questions:
  Q1:
    title: faces better than ep01's first master
    checks:
      - {check: face_first_pass_vs_iter1, min_n: 30}
      - {check: refine_decision_recall, min_n: 12, kind: mechanism}
      - {check: outside_invariant, min_n: 12, kind: mechanism}
    gates: [instrument_gate.face_eye.cel, unrecorded_le_half]
    staged: [SR-1, SR-0]
  Q2:
    title: as good as iter3, first time
    checks:
      - {check: face_first_pass_vs_iter3, min_n: 30}
      - {check: D1, min_n: 5}
    gates: [instrument_gate.face_eye.cel, unrecorded_le_half]
    staged: [SR-1, SR-3, SR-0]
  Q3:
    title: mid faces get drawn eyes
    checks:
      - {check: face_mid_tier, min_n: 10}
      - {check: panel_take_size, min_n: 8, ungated: true}
    gates: [instrument_gate.face_eye.cel]
    staged: [SR-4, SR-0]
  Q4:
    title: tiny faces look good
    real_run: true
    checks:
      - {check: tiny_face_path, min_n: 1, kind: mechanism}
    staged: [SR-0]
  Q5:
    title: ep02 machine time under 6 h
    time: true
    checks:
      - {check: time_backtest_loo, min_n: 4}
      - {check: A-caps, min_n: 1, kind: mechanism}
    staged: [SR-2, SR-4]
    baseline: "ep01: 0 of 1 episodes under 6 h (first master 6.02 h, clock.jsonl)"
  Q6:
    title: start to upload-ready, unattended
    cap_uncalibrated_shape: true
    checks:
      - {check: incident_coverage, min_n: 1, kind: mechanism}
      - {check: preconditions_ch2, min_n: 1, kind: mechanism}
      - {check: S0a, min_n: 1}
      - {check: S0b, min_n: 1}
      - {check: A-canned, min_n: 1, kind: mechanism}
      - {check: F1, min_n: 1, kind: mechanism}
      - {check: F2, min_n: 1, kind: mechanism}
      - {check: F9, min_n: 1, kind: mechanism}
      - {check: F13, min_n: 1, kind: mechanism}
      - {check: F18, min_n: 1, kind: mechanism}
    staged: [SR-5, SR-4]
  Q7:
    title: finished the same day, with an operator
    real_run: true
    time: true
    staged: []
    baseline: "ep01: 30.85 h wall, 4.7 h unlogged waiting; no rehearsal clock answers this (R15)"
  Q8:
    title: story and staging better
    real_run: true
    compliance_apart: true
    checks:
      - {check: plan_battery_ch2, min_n: 1, kind: compliance}
    staged: [SR-4, SR-2]
