# Every gate added since 2026-10-14 (2026-10-21_ep02_proof DESIGN 4.6), replayed by scripts/proof/gate_replay.py
# over frozen delivered episodes.  Each gate: its dotted callable (module:attribute), the reader in
# gate_replay.READERS that turns one frozen episode into the callable's inputs, the date and commit it
# landed, the unit counted, the question its row answers, and the owner's rulings on its refusals:
# `confirmed` (TRUE faults) and `ruled_false` (false refusals), each unit with its source -- only an owner's
# ruling puts a refusal in either -- and `expected` ({why, source}) when a dated owner ruling already says
# every other refusal of the gate is the behaviour asked for.  A refusal in none of them is UNRULED, never
# false.  A gate with no refusal to replay names `why_not_replayed` instead of a reader.  `counts` says what
# a hit is: a refusal (the default), an advisory flag (log only) or a reworded row (a wording change).
since: "2026-10-14"

episodes:
