[project]
name = "studio-parser"
version = "0.1.0"
description = "Project Gutenberg book parser for Visurena Studio"
requires-python = ">=3.13"
authors = [
    { name = "Vishnu Surya" }
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "lxml==6.0.2",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pyyaml==6.0.2",
    "langchain==1.2.13",
    "langchain-ollama==1.0.1",
    "langchain-openai==1.1.12",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.12"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
