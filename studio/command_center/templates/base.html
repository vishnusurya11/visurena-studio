<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Visurena Studio{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f6f3ec; --paper-2:#eee9df; --ink:#1d1a16; --ink-2:#4d473d; --ink-3:#7d7566;
  --rule:#d6cfc0; --rule-2:#bfb6a3; --line:#9c937f;
  --code:#e9e4d7; --code-ink:#3b352c;
  --accent:#a4341f; --accent-ink:#ffffff;
  --think:#2c4f6b; --think-bg:#e3ebf2;
  --qc:#5f4b1c; --qc-bg:#f1e8c9;
  --invent:#6a3b8f; --invent-bg:#ece3f3;
  --ok:#2f6b3a; --ok-bg:#dfeee2;
  --lead:#1d1a16; --lead-ink:#f6f3ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#181613; --paper-2:#211e1a; --ink:#ece7dc; --ink-2:#c3bbab; --ink-3:#8f8778;
    --rule:#3a352d; --rule-2:#4d473d; --line:#6a6254;
    --code:#2a2621; --code-ink:#d8d1c2;
    --accent:#e0664c; --accent-ink:#1d1a16;
    --think:#9dc0dd; --think-bg:#1f2e3b;
    --qc:#e2c979; --qc-bg:#332b16;
    --invent:#c8a6e0; --invent-bg:#2c2035;
    --ok:#8fcf9b; --ok-bg:#1e3323;
    --lead:#ece7dc; --lead-ink:#181613;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#181613; --paper-2:#211e1a; --ink:#ece7dc; --ink-2:#c3bbab; --ink-3:#8f8778;
  --rule:#3a352d; --rule-2:#4d473d; --line:#6a6254;
  --code:#2a2621; --code-ink:#d8d1c2;
  --accent:#e0664c; --accent-ink:#1d1a16;
  --think:#9dc0dd; --think-bg:#1f2e3b;
  --qc:#e2c979; --qc-bg:#332b16;
  --invent:#c8a6e0; --invent-bg:#2c2035;
  --ok:#8fcf9b; --ok-bg:#1e3323;
  --lead:#ece7dc; --lead-ink:#181613;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 56px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.05}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:600}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
code{background:var(--code);color:var(--code-ink);padding:1px 5px;border-radius:3px}
header.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;border-bottom:3px solid var(--ink);padding:10px 16px;max-width:1180px;margin:0 auto}
header.top .brand{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;text-decoration:none;color:var(--ink)}
header.top nav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
header.top nav a{color:var(--ink-2);text-decoration:none}
header.top nav a:hover{color:var(--ink);text-decoration:underline}
header.top .spacer{flex:1}
.crumbs{color:var(--ink-3);font-size:12.5px;margin:8px 0 4px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.strip{border-top:1px solid var(--rule);padding:10px 0}
.strip .row{padding:3px 0}
.st{display:inline-block;min-width:1.7em;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;line-height:1.3}
.st.red{color:var(--accent)}
.st.black{color:var(--ink);font-weight:700;border:2px solid var(--ink);border-radius:2px;padding:0 2px}
.st.amber{color:var(--qc)}
.st.purple{color:var(--invent)}
.st.blue{color:var(--think);animation:pulse 1.4s ease-in-out infinite}
.st.green{color:var(--ok)}
.st.grey{color:var(--ink-3)}
@keyframes pulse{50%{opacity:.35}}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.lane{border:1px solid var(--rule);background:var(--paper-2);padding:10px;min-width:0}
.lane .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.bar{display:flex;height:8px;gap:1px;margin:6px 0}
.bar i{display:block;flex:1;background:var(--rule-2)}
.bar i.green{background:var(--ok)} .bar i.amber{background:var(--qc)} .bar i.blue{background:var(--think)}
.bar i.red{background:var(--accent)} .bar i.purple{background:var(--invent)} .bar i.black{background:var(--ink)}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
th{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
tr.emph td{background:var(--paper-2)}
.muted{color:var(--ink-3)}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--rule-2);color:var(--ink-2);background:var(--paper);margin:2px 2px 2px 0}
.chip.red{border-color:var(--accent);color:var(--accent)} .chip.green{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.chip.amber{border-color:var(--qc);color:var(--qc);background:var(--qc-bg)} .chip.blue{border-color:var(--think);color:var(--think);background:var(--think-bg)}
.chip.purple{border-color:var(--invent);color:var(--invent);background:var(--invent-bg)} .chip.black{border-color:var(--ink);color:var(--ink);border-width:2px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.steps .step{display:inline-flex;flex-direction:column;align-items:center;min-width:52px;border:1px solid var(--rule);padding:4px 6px;background:var(--paper-2);font-size:12px}
.steps .step small{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.panel{border-top:1px solid var(--rule);padding-top:8px;min-width:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs img{width:120px;height:120px;object-fit:cover;border:1px solid var(--rule-2);background:var(--code)}
.thumbs img.wide{width:100%;height:auto;max-height:180px;object-fit:contain}
video{max-width:100%;background:#000;display:block}
.tail{font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;margin:0}
.tail .WARNING{color:var(--qc)} .tail .ERROR,.tail .CRITICAL{color:var(--accent)}
button.btn{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink);border-radius:3px;cursor:pointer}
button.btn[disabled]{opacity:.45;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:28px;padding-top:10px;border-top:1px solid var(--rule);color:var(--ink-2);font-size:12.5px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.filters select,.filters input{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink)}
.grid td.cell{text-align:center}
.plain{max-width:60ch;margin:64px auto;padding:0 16px}
.actions{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start;margin:8px 0}
form.act{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 4px 0 0}
form.act input,form.act select,form.act textarea{font:inherit;font-size:12.5px;padding:2px 6px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);max-width:100%}
form.act.redo{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:6px;max-width:60ch}
form.act.redo textarea{width:100%}
details.redo summary{list-style:none;display:inline-block}
.receipt{font-size:12px}
.receipt .ok{color:var(--ok)} .receipt .refused{color:var(--accent)}
/* the department table at a glance */
.depthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1.cap{text-transform:capitalize}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.tpill{font-family:"IBM Plex Mono",monospace;font-size:12px;text-decoration:none;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px;background:var(--paper)}
.tpill b{color:var(--ink);font-weight:600;margin-left:3px}
.tpill:hover{border-color:var(--ink-2)}
.tpill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)} .tpill.on b{color:var(--paper)}
.tpill.running{color:var(--think);border-color:var(--think)} .tpill.done{color:var(--ok);border-color:var(--ok)}
.tpill.flagged{color:var(--qc);border-color:var(--qc)} .tpill.deferred{color:var(--invent);border-color:var(--invent)}
.tpill.failed,.tpill.stale{color:var(--accent);border-color:var(--accent)} .tpill.escalated{color:var(--ink);border-width:2px}
.bookgroup{margin-top:22px}
.bookhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bookname{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700;color:var(--ink);text-decoration:none}
.bookname:hover{text-decoration:underline}
.minibar{display:inline-flex;gap:2px;flex:1;min-width:120px;max-width:360px;height:10px}
.minibar i{flex:1;background:var(--rule-2);border-radius:1px}
.minibar i.green{background:var(--ok)} .minibar i.amber{background:var(--qc)} .minibar i.blue{background:var(--think)}
.minibar i.red{background:var(--accent)} .minibar i.purple{background:var(--invent)} .minibar i.black{background:var(--ink)}
table.dept{margin-top:2px}
table.dept th{padding-top:8px}
table.dept td{vertical-align:middle;padding:7px 8px}
table.dept tbody tr:hover td{background:var(--paper-2)}
table.dept tr.emph td{background:var(--think-bg)}
table.dept tr.row-red.emph td{background:transparent;box-shadow:inset 3px 0 0 var(--accent)}
th.gate,td.gate{text-align:center;padding-left:4px;padding-right:4px}
th.num,td.num{text-align:right}
td.unit a{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--rule-2);color:var(--ink-3);background:var(--paper);min-width:92px}
.pill .word{letter-spacing:.02em}
.pill.green{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.amber{color:var(--qc);border-color:var(--qc);background:var(--qc-bg)}
.pill.blue{color:var(--think);border-color:var(--think);background:var(--think-bg)}
.pill.purple{color:var(--invent);border-color:var(--invent);background:var(--invent-bg)}
.pill.red{color:var(--accent-ink);border-color:var(--accent);background:var(--accent)}
.pill.black{color:var(--paper);border-color:var(--ink);background:var(--ink)}
.pill.blue{animation:pulse 2s ease-in-out infinite}
.steps-cell{min-width:190px}
.sbar{display:flex;gap:2px;height:9px;width:190px}
.sbar i{flex:1;background:var(--rule);border-radius:1px}
.sbar i.green{background:var(--ok)} .sbar i.amber{background:var(--qc)} .sbar i.blue{background:var(--think);animation:pulse 1.4s ease-in-out infinite}
.sbar i.red{background:var(--accent)} .sbar i.purple{background:var(--invent)} .sbar i.black{background:var(--ink)} .sbar i.grey{background:var(--line)}
.sbar i.cur{outline:2px solid var(--ink);outline-offset:1px}
.sline{font-size:12px;color:var(--ink-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.sline b{font-weight:500;color:var(--ink)}
.dot{display:inline-block;min-width:22px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--line)}
.dot.green{color:var(--ok)} .dot.amber{color:var(--qc)} .dot.red{color:var(--accent)} .dot.purple{color:var(--invent)} .dot.blue{color:var(--think)}
td.acts{width:1%;text-align:right}
details.menu{position:relative;display:inline-block}
details.menu summary{list-style:none;cursor:pointer;font-size:16px;line-height:1;padding:2px 8px;border-radius:3px;color:var(--ink-3)}
details.menu summary::-webkit-details-marker{display:none}
details.menu[open] summary,details.menu summary:hover{background:var(--paper-2);color:var(--ink)}
details.menu .menu-body{position:absolute;right:0;top:calc(100% + 4px);z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px;background:var(--paper);border:1px solid var(--rule-2);box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px;white-space:nowrap}
/* the unit page (research F): one question per band */
.spacer{flex:1}
.band{border-top:1px solid var(--rule);padding:10px 0 12px}
.bandhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.small{font-size:12.5px}
.ok{color:var(--ok)} .warn{color:var(--qc)}
.clip1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.uhead{padding:2px 0 8px}
.uhead-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.uhead h1{font-size:40px}
.utitle{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600;color:var(--ink-2)}
.where{font-family:"IBM Plex Mono",monospace;font-size:13px}
.uq{font-style:italic;color:var(--ink-2);margin-top:2px}
.umeta{display:flex;flex-wrap:wrap;gap:2px 0;font-size:12.5px;color:var(--ink-3);margin:6px 0 10px}
.umeta>span:not(:last-child)::after{content:"·";margin:0 7px;color:var(--rule-2)}
.ubar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.ubar .seg{display:flex;flex-direction:column;align-items:flex-start;min-width:0;font-size:12px}
.ubar .seg i{display:block;width:100%;height:12px;background:var(--rule);border-radius:1px;margin-bottom:4px}
.ubar .seg.green i{background:var(--ok)} .ubar .seg.amber i{background:var(--qc)} .ubar .seg.red i{background:var(--accent)}
.ubar .seg.purple i{background:var(--invent)} .ubar .seg.black i{background:var(--ink)}
.ubar .seg.blue i{background:var(--think);animation:pulse 1.4s ease-in-out infinite}
.ubar .seg.cur i{outline:2px solid var(--ink);outline-offset:1px}
.ubar .sid{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
.ubar .sid .st{min-width:1.3em;text-align:left}
.ubar small{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ubar .dur{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2)}
.reason{font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reason b{font-weight:600;margin-right:6px}
.loop{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:1px 8px;border-radius:3px}
.okline{color:var(--ok);font-weight:500}
.passes{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 6px}
.pass{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--rule-2);border-left-width:4px;background:var(--paper);white-space:nowrap;cursor:default}
.pass b{font-weight:500;color:var(--ink-3);margin-right:2px}
.pass.green{border-left-color:var(--ok)} .pass.red{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--paper))}
.pass.purple{border-left-color:var(--invent);background:var(--invent-bg)} .pass.blue{border-left-color:var(--think);background:var(--think-bg)}
.pass.grey{border-left-color:var(--line)} .pass.more{border:0}
.trend{font-size:12.5px;margin:3px 0}
.trend b{font-family:"IBM Plex Mono",monospace;font-weight:600;margin-right:6px}
details.why{margin-top:6px} details.why summary,details.pfold summary,details.more summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
td.note{white-space:normal;overflow-wrap:anywhere;min-width:160px;max-width:520px}
table.small td,table.small th{padding:3px 6px;font-size:12px}
.gchips{display:inline-flex;flex-wrap:wrap;gap:4px}
.gchip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;text-decoration:none;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:1px 4px 1px 9px;text-transform:lowercase}
.gchip .dot{min-width:0;margin-left:2px}
.gate{margin:6px 0 10px}
.ghead{font-size:13px;margin-bottom:3px}
.kind{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12.5px;margin:2px 0 2px 12px}
.kname{min-width:118px;font-family:"IBM Plex Mono",monospace}
.kname b{font-weight:600;color:var(--qc)}
.shotchip{font-family:"IBM Plex Mono",monospace;font-size:11px;text-decoration:none;color:var(--ink);background:var(--paper-2);border:1px solid var(--rule-2);padding:0 4px;border-radius:2px}
a.shotchip:hover{border-color:var(--ink)}
.knote{flex:1 1 200px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px;font-size:12px}
.pblock{margin-bottom:10px}
.filt{display:inline-flex;gap:4px} .filt .tpill{cursor:pointer;font:inherit;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:1px 9px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,120px);gap:6px}
.tiles.only-flagged .tile:not(.flagged){display:none}
.tile{position:relative;margin:0;width:120px;height:120px;background:var(--code);border:1px solid var(--rule-2);cursor:zoom-in;overflow:hidden}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;background:var(--code)}
.tile.flagged{border-color:var(--qc);box-shadow:inset 0 0 0 1px var(--qc)}
.tile:target,.tile:focus-visible{outline:3px solid var(--qc);outline-offset:2px;animation:pulse 1s ease-in-out 3}
.tile .num{position:absolute;top:3px;left:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;background:var(--paper);color:var(--ink);padding:0 4px;border-radius:2px}
.tile .size{position:absolute;bottom:3px;left:3px;font-family:"IBM Plex Mono",monospace;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:0 4px;border-radius:2px}
.tile .badges{position:absolute;top:3px;right:3px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:88px}
.badge{font-family:"IBM Plex Mono",monospace;font-size:9.5px;background:var(--qc-bg);color:var(--qc);border:1px solid var(--qc);padding:0 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.badge.red{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .badge.grey{background:var(--paper);color:var(--ink-3);border-color:var(--rule-2)}
.slots{display:flex;flex-wrap:wrap;gap:3px}
.slot{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);border:1px dashed var(--rule-2);padding:3px 6px;border-radius:2px}
img.strip{max-width:100%;max-height:160px;margin-top:6px;border:1px solid var(--rule-2)}
.mrow{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;align-items:start}
.mrow video{width:100%;aspect-ratio:1/1;object-fit:contain}
.mqc{font-size:13px;display:flex;flex-direction:column;gap:4px}
.mqc .kind{margin-left:0}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:16px}
.acts .actions{align-items:center}
button.btn.primary,summary.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.drawer summary{list-style:none;display:inline-block;cursor:pointer}
details.drawer summary::-webkit-details-marker{display:none}
details.drawer[open]{flex-basis:100%;order:9}
details.drawer form.act.redo{max-width:none;width:100%}
.picks{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
.orow{font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--rule)}
details.raw>summary{cursor:pointer;list-style:none}
details.raw>summary::-webkit-details-marker{display:none}
details.raw[open]>summary{margin-bottom:8px}
.rawpart{margin:8px 0 14px}
.rawpart details summary{cursor:pointer}
ul.items{margin:4px 0;padding-left:16px;font-size:12px}
ul.items li{margin:1px 0}
ul.items li.head{color:var(--ink-3);list-style:none;margin-left:-12px}
ul.items li.adv{color:var(--ink-3)}
.mark{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
td.lvl.WARNING{color:var(--qc)} td.lvl.ERROR,td.lvl.CRITICAL{color:var(--accent)}
.tail,td.note{overflow-wrap:anywhere}
.tail{max-height:12lh;overflow:auto}
dialog#lightbox{width:min(1100px,94vw);max-height:92vh;padding:14px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink)}
dialog#lightbox::backdrop{background:rgba(0,0,0,.6)}
.lb-close{float:right}
.lb-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.lb-pic img,.lb-pic video{width:100%;height:auto;display:block;background:var(--code)}
.lb-text p{margin:2px 0 8px;font-size:13.5px}
.lb-faults{margin:2px 0 8px;padding-left:16px;font-size:13px}
.lb-nav{font-size:11.5px;margin-top:6px}
@media (max-width:760px){
  .uhead h1{font-size:32px} .utitle{font-size:20px}
  .ubar small,.ubar .dur{display:none}
  .ubar .sid{font-size:10px}
  .ubar .sid .st{display:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{width:auto;height:auto;aspect-ratio:1/1}
  .mrow,.acts,.lb-body{grid-template-columns:1fr}
  .kname{min-width:0}
  .knote{flex-basis:100%;margin-left:0}
  .acts-main .actions{position:sticky;bottom:0;background:var(--paper);padding:6px 0;z-index:3}
}
@media (max-width:760px){
  table.dept thead{display:none}
  table.dept,table.dept tbody{display:block}
  table.dept tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.dept td{border:0;padding:0}
  table.dept td.gate,table.dept td.num:not(:first-of-type){display:none}
  table.dept td.steps-cell{grid-column:1 / -1;min-width:0}
  .sbar{width:100%}
  .sline{max-width:none;white-space:normal}
  .pill{min-width:0}
}
/* live card (progress tracker spec §5) */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-std:cubic-bezier(.4,0,.2,1);
 --d1:120ms;--d2:240ms;--d3:480ms;--d4:900ms;--breathe:2.8s;--sheen:2.4s;--stripe:1.6s;
 --think-glow:color-mix(in srgb,var(--think) 35%,transparent);
 --sheen-hi:color-mix(in srgb,#fff 55%,transparent)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--sheen-hi:color-mix(in srgb,#fff 22%,transparent);--think-glow:color-mix(in srgb,var(--think) 45%,transparent)}
}
:root[data-theme="dark"]{--sheen-hi:color-mix(in srgb,#fff 22%,transparent);--think-glow:color-mix(in srgb,var(--think) 45%,transparent)}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@property --dev{syntax:'<number>';inherits:true;initial-value:0}
.st.blue,.sbar i.blue,.ubar .seg.blue i,.pill.blue{animation:none}
.live{position:relative;margin:12px 0 16px;padding:14px 18px 12px;background:var(--paper);border:1px solid var(--rule-2);border-top:3px solid var(--ink);font-variant-numeric:tabular-nums}
.live .lv-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.lv-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.lv-name small{font-size:18px;font-weight:500;color:var(--ink-2)}
.lv-vital{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.lv-vital .lv-where{letter-spacing:.04em;color:var(--ink)}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);flex:none}
.live[data-vital="live"] .vdot{background:var(--think)} .live[data-vital="live"] [data-k="vword"]{color:var(--think)}
.live[data-vital="quiet"] .vdot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.live[data-vital="stalled"] .vdot{background:var(--qc)} .live[data-vital="stalled"] [data-k="vword"],.live[data-vital="stalled"] [data-k="reason"]{color:var(--qc)}
.live[data-vital="dead"] .vdot,.live[data-vital="refused"] .vdot{background:var(--accent)}
.live[data-vital="dead"] [data-k="vword"],.live[data-vital="refused"] [data-k="vword"]{color:var(--accent)}
.live[data-vital="deferred"] .vdot{background:var(--think)} .live[data-vital="deferred"] [data-k="vword"]{color:var(--think)}
.live[data-vital="done"] .vdot{background:var(--ok)} .live[data-vital="done"] [data-k="vword"]{color:var(--ok)}
.lv-sign{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
.lv-reason:not(:empty)::after{content:" · ";color:var(--ink-2)}
.lv-trace{display:block;width:240px;height:24px;max-width:38vw;overflow:visible}
.lv-trace polyline{fill:none;stroke:var(--think);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.live[data-still] .lv-trace polyline{stroke:var(--line)}
.lv-hero{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 28px;align-items:end;margin:16px 0 14px}
.lv-big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:72px;line-height:.86;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.lv-big .of{color:var(--ink-2);font-weight:600}
.lv-big small{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.lv-step{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.lv-step .cur{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-2)}
.lv-finish{font-size:21px;line-height:1.25;margin-top:4px;color:var(--ink)}
.lv-finish b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:20px}
.lv-why{font-size:13px;color:var(--ink-2)}
.lv-range{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);margin-top:4px}
.lv-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px;margin:0 0 14px;padding:8px;background:var(--paper-2);border:1px solid var(--rule)}
.lt{position:relative;margin:0;aspect-ratio:1/1;background:var(--code);overflow:hidden;border-radius:2px;cursor:default}
.lt img{display:block;width:100%;height:100%;object-fit:cover}
.lt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.lt-id{position:absolute;left:3px;bottom:3px;z-index:2;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;line-height:1.3;padding:0 3px;border-radius:2px;background:var(--paper);color:var(--ink)}
.lt::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:2px}
.lt.st-waiting{background:transparent;outline:1px dashed var(--rule-2);outline-offset:-1px}
.lt.st-waiting img{opacity:.25;filter:grayscale(.6)}
.lt.st-waiting .lt-id{background:transparent;color:var(--ink-2)}
.lt.st-rendering img{filter:grayscale(1) contrast(calc(.4 + .6 * var(--dev)));opacity:calc(.25 + .75 * var(--dev))}
.lt.st-rendering::after{padding:3px;background:repeating-conic-gradient(from -2deg,var(--paper-2) 0 4deg,transparent 4deg 45deg),conic-gradient(var(--think) calc(var(--dev) * 1turn),var(--rule) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lt.st-rendering .lt-id{background:var(--think);color:var(--paper)}
.lt.st-failed::after{box-shadow:inset 0 0 0 3px var(--accent)}
.lt.st-failed::before{content:"✕";position:absolute;top:2px;right:4px;z-index:2;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent)}
.lt.st-retake::before{content:"r2";position:absolute;top:3px;right:3px;z-index:2;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;padding:0 3px;border-radius:2px;background:var(--qc-bg);color:var(--qc);border:1px solid var(--qc)}
.lv-rail{display:flex;gap:2px;list-style:none;margin:2px 0 10px;padding:0;align-items:flex-start}
.lv-rail .seg{flex:var(--w) 1 0;min-width:18px;display:flex;flex-direction:column;gap:4px}
.lv-rail .seg.st-running{min-width:calc(var(--n, 6) * 5px)}
.lv-rail i{position:relative;display:block;height:10px;background:var(--rule);border-radius:1px;overflow:hidden}
.lv-rail i::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p) * 100%);background:var(--think);transition:width var(--d4) var(--ease-out),background-color var(--d2) var(--ease-std)}
.lv-rail .st-done i::before{width:100%;background:var(--ok)}
.lv-rail .st-skip i::before{width:100%;background:color-mix(in srgb,var(--ok) 40%,var(--rule))}
.lv-rail .st-fail i::before,.lv-rail .st-refused i::before{width:100%;background:var(--accent)}
.lv-rail .st-deferred i::before,.lv-rail .st-escalated i::before{width:100%;background:var(--qc)}
.lv-rail .is-loop i::before{width:100%;background:repeating-linear-gradient(-45deg,var(--think) 0 6px,color-mix(in srgb,var(--think) 70%,var(--paper)) 6px 12px);background-size:16.97px 16.97px}
.lv-rail i::after{content:"";position:absolute;inset:0;opacity:0;background:linear-gradient(100deg,transparent 30%,var(--sheen-hi) 50%,transparent 70%);background-size:200% 100%;transition:opacity var(--d2) var(--ease-std)}
.lv-rail .ticks{position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n) - 1px),var(--paper) calc(100% / var(--n) - 1px) calc(100% / var(--n)))}
.lv-rail .lbl{display:flex;align-items:center;gap:3px;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.lv-rail .lbl small{font-weight:500;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.lv-rail .lbl sup{font-size:9px;font-weight:500;color:var(--ink-2)}
.lv-rail .st-running .lbl{color:var(--ink)}
.lv-rail .dur{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.lv-rail .ck{width:10px;height:10px;flex:none}
.lv-rail .ck path{fill:none;stroke:var(--ok);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}
.lv-railm{display:none;margin:0 0 10px;font-size:13px}
.lv-railm summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.lv-railm ul{list-style:none;margin:6px 0 0;padding:0}
.lv-railm li{padding:2px 0;border-bottom:1px solid var(--rule)} .lv-railm li span{color:var(--ink-2);font-size:12px}
.lv-railm li.st-running b{color:var(--think)} .lv-railm li.st-done b{color:var(--ok)}
.lv-ladder{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 6px;font-size:12.5px}
.lv-gate{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.lv-gate .eyebrow{color:var(--ink-2);margin-right:2px}
.lv-gate .arr{color:var(--ink-2)}
.rung{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:1px 7px;border:1px solid var(--rule-2);border-radius:999px;background:var(--paper-2);color:var(--ink);white-space:nowrap}
.rung b{font-weight:600}
.rung.term{background:transparent;border-style:dashed;border-color:var(--ink-2);color:var(--ink-2)}
.rung.term small{font-size:10.5px}
.lv-words{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-words .eyebrow{margin-right:6px}
.lv-words q{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
.lv-stop{margin:14px 0 4px}
.lv-sentence{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:600;line-height:1.2;margin:0 0 8px;color:var(--ink);max-width:70ch;overflow-wrap:anywhere}
.lv-sentence q{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;font-weight:400;color:var(--ink)}
.lv-master{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:start;margin:0 0 14px}
.lv-master video{width:100%;aspect-ratio:1/1;object-fit:contain}
.lv-qc{font-size:13px;display:flex;flex-direction:column;gap:4px} .lv-qcline b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.lv-notify{font-size:11px;padding:1px 7px}
@media (prefers-reduced-motion: no-preference){
  .live:not([data-still]) .vdot.beat{animation:lv-halo var(--breathe) var(--ease-out) 1}
  .live:not([data-still]) .seg.is-moving i::after{opacity:1;animation:lv-sheen var(--sheen) linear infinite;animation-delay:calc(var(--age) * -1s)}
  .live:not([data-still]) .seg.is-moving.is-loop i::before{animation:lv-stripe var(--stripe) linear infinite;animation-delay:calc(var(--age) * -1s)}
  .lt.just img{animation:lv-reveal var(--d3) var(--ease-out) both}
  .lt.just::after{animation:lv-landed 2s var(--ease-out) both}
  .seg.just .ck path{animation:lv-draw 320ms var(--ease-out) both}
  .lv-rail.sweep .seg i::before{animation:lv-sweep var(--d3) var(--ease-out) both;animation-delay:calc(var(--i) * 40ms)}
}
@keyframes lv-halo{0%{box-shadow:0 0 0 0 var(--think-glow)}100%{box-shadow:0 0 0 6px transparent}}
@keyframes lv-sheen{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes lv-stripe{from{background-position:0 0}to{background-position:16.97px 0}}
@keyframes lv-reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes lv-landed{from{box-shadow:inset 0 0 0 1px var(--ok)}to{box-shadow:inset 0 0 0 1px transparent}}
@keyframes lv-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes lv-sweep{from{background:var(--ok);width:0}to{background:var(--ok);width:100%}}
@media (prefers-reduced-motion: reduce){.live *{animation:none!important;transition-duration:1ms!important}}
@media (max-width:600px){
  .live{padding:12px 12px 10px}
  .lv-trace{width:120px}
  .lv-hero{grid-template-columns:1fr;gap:4px}
  .lv-big{font-size:44px}
  .lv-sheet{grid-template-columns:repeat(6,minmax(0,1fr));max-height:60vh;overflow-y:auto}
  .lv-rail{display:none} .lv-railm{display:block}
  .lv-master{grid-template-columns:1fr}
  .lv-words{white-space:normal}
}
/* /live card */

<script>
document.body.addEventListener('htmx:beforeSwap', function(e){
  var x = e.detail.xhr, path = (e.detail.requestConfig || {}).path || '';
  if (x && x.status >= 400 && x.status < 500 && path.indexOf('/act/') === 0) { e.detail.shouldSwap = true; e.detail.isError = false; }
});
(function(){
  var key='cc-theme', root=document.documentElement;
  try{var t=localStorage.getItem(key); if(t){root.dataset.theme=t;}}catch(e){}
  var b=document.getElementById('theme');
  if(b){b.onclick=function(){var n=root.dataset.theme==='dark'?'light':'dark'; root.dataset.theme=n; try{localStorage.setItem(key,n);}catch(e){}};}
})();
